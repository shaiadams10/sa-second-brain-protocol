<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logbook · Second Brain</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230b0e13'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h10' stroke='%235aa2ff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
  <link rel="stylesheet" href="app.css">
  <script>
    try {
      const t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("brain-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-left" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></symbol>
    <symbol id="i-right" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></symbol>
    <symbol id="i-run" viewBox="0 0 16 16"><path d="M5 3.2v9.6L12.6 8z"/></symbol>
    <symbol id="i-spin" viewBox="0 0 16 16"><path d="M8 2.2a5.8 5.8 0 1 1-5.6 4.3"/></symbol>
    <symbol id="i-strike" viewBox="0 0 16 16"><path d="M2.5 8h11M5 4.5h6M5 11.5h4"/></symbol>
    <symbol id="i-undo" viewBox="0 0 16 16"><path d="M5.5 4 2.5 7l3 3"/><path d="M2.5 7h7a4 4 0 0 1 0 8h-2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 16 16"><path d="M8 14.5V9.8M4.5 9.8h7l-1.2-2.4V3.2h-4.6v4.2z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></symbol>
    <symbol id="i-moon" viewBox="0 0 16 16"><path d="M13.2 10.1A5.6 5.6 0 0 1 5.9 2.8a5.6 5.6 0 1 0 7.3 7.3z"/></symbol>
    <symbol id="i-auto" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 2.4a5.6 5.6 0 0 1 0 11.2z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-alert" viewBox="0 0 16 16"><path d="M8 2.2 14.2 13H1.8z"/><path d="M8 6.5v3M8 11.3v.2"/></symbol>
  </svg>

  <header class="top">
    <div class="brand"><b>Logbook</b><span id="owner"></span></div>
    <div class="pager" id="pager"></div>
    <div class="right">
      <div class="lastrun" id="lastrun"></div>
      <button class="btn ghost icon" id="theme" type="button" aria-label="Switch theme"></button>
      <button class="btn primary" id="runnow" type="button"></button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views" id="tabs"></nav>
  <main id="view" tabindex="-1"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
