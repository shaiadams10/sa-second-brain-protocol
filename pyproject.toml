[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "personal-second-brain-protocol"
version = "0.1.0"
description = "Evidence-backed local-first personal second-brain protocol"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Shai Adams" }]
dependencies = [
  "basic-memory==0.22.1",
  "graphifyy==0.9.16",
  "jsonschema==4.25.1",
  "pypdf==5.9.0",
  "PyYAML==6.0.2"
]

[project.scripts]
sb = "second_brain_protocol.cli:main"

[dependency-groups]
dev = ["pytest==8.4.1", "pytest-cov==6.2.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

