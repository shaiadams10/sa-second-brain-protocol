[project]
name = "second-brain"
version = "2.0.0.dev0"
description = "A weekly job that reads your AI coding conversations and project folders and keeps a private Markdown second brain up to date."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
brain = "brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]
