name: Feature request
description: Propose a privacy-preserving protocol improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the workflow gap without including personal data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, review rules, and failure behavior.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Safety boundaries
      options:
        - label: Source projects remain read-only.
          required: true
        - label: Raw personal evidence remains outside Git.
          required: true
        - label: Deterministic validation remains between model output and canonical notes.
          required: true
